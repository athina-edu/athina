{% extends 'base.html' %}
{% block title %}Create Faculty Account{% endblock %}
{% block breadcrumbs %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0" style="background: transparent; padding: 0;">
        <li class="breadcrumb-item"><a href="{% url 'accounts:user_list' %}">Users</a></li>
        <li class="breadcrumb-item active">New Faculty</li>
    </ol>
</nav>
{% endblock %}
{% block content %}
<div class="mt-2" style="max-width: 500px;">
<h3>Create Faculty Account</h3>
<hr>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Create Account</button>
    <a class="btn btn-secondary" href="{% url 'accounts:user_list' %}">Cancel</a>
</form>
</div>
{% endblock %}
