version: v1.0
name: Athina Testing
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
global_job_config:
  secrets:
    - name: docker-hub
    - name: sonarcloud
blocks:
  - name: "Build"
    task:
      prologue:
        commands:
          - sem-version python 3.12
          - curl -sSLo /tmp/jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"
          - mkdir -p /opt/jdk21 && tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
          - export JAVA_HOME=/opt/jdk21
          - export PATH="$JAVA_HOME/bin:$PATH"
          - java -version
          - sem-service start mysql
          - sudo apt-get install -y firejail git 
          - rm -rf .git && git init && git remote add origin https://github.com/athina-edu/athina.git && git fetch origin master --depth=50 && git checkout origin/master -f
          - pip install --upgrade pip
          - pip install ".[test]"
          - mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE athina; CREATE USER 'athina'@'127.0.0.1' IDENTIFIED BY 'password'; GRANT ALL PRIVILEGES ON *.* TO 'athina'@'127.0.0.1';"
      env_vars:
        - name: APP_ENV
          value: "prod"
        - name: ATHINA_MYSQL_HOST
          value: "127.0.0.1"
        - name: ATHINA_MYSQL_PORT
          value: "3306"
        - name: ATHINA_MYSQL_USERNAME
          value: "athina"
        - name: ATHINA_MYSQL_PASSWORD
          value: "password"
      jobs:
        - name: Execute python tests with coverage
          commands:
            - pytest --cov=athina --cov-report=xml --cov-branch
        - name: SonarCloud Scan
          commands:
            - |
              if [ -z "$SONAR_LOGIN" ]; then
                echo "Skipping SonarCloud scan: SONAR_LOGIN not configured"
                exit 0
              fi
            - curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389.zip
            - unzip -q /tmp/sonar-scanner.zip -d /tmp/sonar-scanner-dir
            - export PATH="/tmp/sonar-scanner-dir/sonar-scanner-8.1.0.6389/bin:$PATH"
            - export SONAR_TOKEN="$SONAR_LOGIN"
            - sonar-scanner -Dsonar.projectKey=athina-edu_athina -Dsonar.organization=athina-edu -Dsonar.sources=athina -Dsonar.scanner.skipJreProvisioning=true
        - name: Athina test using repo_url_testing parameter
          commands:
            - out=$(bin/athina-cli --config config-examples/ --repo_url_testing=https://github.com/athina-edu/testing.git)
            - echo $out |grep 3.33 | if [ $(wc -l) > 0 ]; then exit 0; else exit 1; fi
        - name: Docker Hub
          commands:
            - echo $DOCKER_PASSWORD | docker login --username "$DOCKER_USERNAME" --password-stdin
            - docker build -t latest .
            - docker tag latest athinaedu/athina:latest
            - docker push athinaedu/athina:latest